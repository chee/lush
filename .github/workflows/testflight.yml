name: TestFlight

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  upload:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)/Contents/Developer"

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain stable \
              --target aarch64-apple-ios --target aarch64-apple-ios-sim

      # Same key as CI's app job, which is the point: a push to main builds
      # every slice and leaves this warm. Cold here has been ~47m against
      # ~13m warm, and that gap was the whole variance in release times.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          shared-key: apple
          workspaces: |
            core
            server-rs

      - name: Build Rust core and bindings
        run: ./core/build-bindings.sh

      - name: Build PatchworkServer xcframework and bindings
        run: ./server-rs/build-xcframework.sh

      - name: Build web bundle
        run: |
          cd web
          npm install -g pnpm
          pnpm install
          pnpm build

      - name: Import signing certificate
        env:
          CERT_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/ci.keychain-db"
          security create-keychain -p ci "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p ci "$KEYCHAIN"
          echo "$CERT_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k ci "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          security default-keychain -s "$KEYCHAIN"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Install App Store Connect API key
        env:
          API_KEY_ID: ${{ secrets.APPLE_API_KEY }}
          API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: |
          mkdir -p "$HOME/private_keys"
          printf '%s' "$API_KEY_CONTENT" > "$HOME/private_keys/AuthKey_$API_KEY_ID.p8"

      - name: Archive (iOS)
        env:
          API_KEY_ID: ${{ secrets.APPLE_API_KEY }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          xcodebuild archive \
            -project Lush.xcodeproj \
            -scheme Lush \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Lush-iOS.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_$API_KEY_ID.p8" \
            -authenticationKeyID "$API_KEY_ID" \
            -authenticationKeyIssuerID "$API_ISSUER"

      - name: Archive (macOS)
        env:
          API_KEY_ID: ${{ secrets.APPLE_API_KEY }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          xcodebuild archive \
            -project Lush.xcodeproj \
            -scheme Lush \
            -destination 'generic/platform=macOS' \
            -archivePath "$RUNNER_TEMP/Lush-macOS.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_$API_KEY_ID.p8" \
            -authenticationKeyID "$API_KEY_ID" \
            -authenticationKeyIssuerID "$API_ISSUER"

      - name: Upload iOS to TestFlight
        env:
          API_KEY_ID: ${{ secrets.APPLE_API_KEY }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Lush-iOS.xcarchive" \
            -exportOptionsPlist .github/ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export/ios" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_$API_KEY_ID.p8" \
            -authenticationKeyID "$API_KEY_ID" \
            -authenticationKeyIssuerID "$API_ISSUER"

      - name: Upload macOS to TestFlight
        env:
          API_KEY_ID: ${{ secrets.APPLE_API_KEY }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Lush-macOS.xcarchive" \
            -exportOptionsPlist .github/ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export/macos" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_$API_KEY_ID.p8" \
            -authenticationKeyID "$API_KEY_ID" \
            -authenticationKeyIssuerID "$API_ISSUER"

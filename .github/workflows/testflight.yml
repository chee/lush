name: TestFlight

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  # One job per platform rather than one job doing both. Two runners means the
  # archives genuinely overlap instead of contending for three cores, and each
  # gets its own keychain and DerivedData — running two xcodebuild archives
  # against one project on one machine is a known source of flakes. The Rust
  # build is repeated in both, which costs runner minutes (free on a public
  # repo) but no wall time, and restores from the shared cache anyway.
  #
  # fail-fast is off deliberately: if one platform fails there is no benefit to
  # cancelling the other mid-upload, and a half-finished upload is worse than a
  # finished one. Note a partial release — one platform up, the other failed —
  # was already possible when these ran in sequence.
  upload:
    name: upload (${{ matrix.platform }})
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: iOS
            destination: "generic/platform=iOS"
          - platform: macOS
            destination: "generic/platform=macOS"
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)/Contents/Developer"

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain stable \
              --target aarch64-apple-ios --target aarch64-apple-ios-sim

      # Same key as CI's app job, which is the point: a push to main builds
      # every slice and leaves this warm. Cold here has been ~47m against
      # ~13m warm, and that gap was the whole variance in release times.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          shared-key: apple
          workspaces: |
            core
            server-rs

      # A step each, in series — same as CI's app job. They share the cargo
      # package cache and take the same exclusive lock on it, which is most of
      # what running them concurrently bought. Apart they stream their own
      # logs and carry their own timings.
      - name: Build Rust core
        run: ./core/build-bindings.sh

      - name: Build PatchworkServer xcframework
        run: ./server-rs/build-xcframework.sh

      - name: Build web bundle
        run: |
          cd web
          npm install -g pnpm
          pnpm install
          pnpm build

      - name: Import signing certificate
        env:
          CERT_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/ci.keychain-db"
          security create-keychain -p ci "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p ci "$KEYCHAIN"
          echo "$CERT_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k ci "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          security default-keychain -s "$KEYCHAIN"
          security find-identity -v -p codesigning "$KEYCHAIN"
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | grep -o '"[^"]*"' | head -1 | tr -d '"')
          echo "CODE_SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Install App Store Connect API key
        env:
          API_KEY_ID: ${{ secrets.APPLE_API_KEY }}
          API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: |
          mkdir -p "$HOME/private_keys"
          printf '%s' "$API_KEY_CONTENT" > "$HOME/private_keys/AuthKey_$API_KEY_ID.p8"

      - name: Archive
        env:
          API_KEY_ID: ${{ secrets.APPLE_API_KEY }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          xcodebuild archive \
            -project Lush.xcodeproj \
            -scheme Lush \
            -destination '${{ matrix.destination }}' \
            -archivePath "$RUNNER_TEMP/Lush-${{ matrix.platform }}.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_$API_KEY_ID.p8" \
            -authenticationKeyID "$API_KEY_ID" \
            -authenticationKeyIssuerID "$API_ISSUER" \
            CODE_SIGN_STYLE=Automatic \
            CODE_SIGN_IDENTITY="$CODE_SIGN_IDENTITY"

      - name: Upload to TestFlight
        env:
          API_KEY_ID: ${{ secrets.APPLE_API_KEY }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Lush-${{ matrix.platform }}.xcarchive" \
            -exportOptionsPlist .github/ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export/${{ matrix.platform }}" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_$API_KEY_ID.p8" \
            -authenticationKeyID "$API_KEY_ID" \
            -authenticationKeyIssuerID "$API_ISSUER"

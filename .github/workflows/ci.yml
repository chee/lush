name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: rust (${{ matrix.crate }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate: [core, server-rs]
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: ${{ matrix.crate }}

      - name: Test
        working-directory: ${{ matrix.crate }}
        run: cargo test

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm test

      - run: pnpm build

  app:
    name: app (iOS simulator)
    # Would be worth ~2x here — the job is ~70% rustc — but macos-26-xlarge
    # is not available to this account: the job is handed no runner and fails
    # in two seconds with no steps and no log. Needs larger runners enabling
    # on the plan first, then this is a one-line change.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)/Contents/Developer"

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain stable \
              --target aarch64-apple-ios --target aarch64-apple-ios-sim

      # shared-key rather than the default per-job one, so the TestFlight
      # upload can restore what a push to main built. rust-cache keys on the
      # job otherwise, and those two have never shared anything.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          shared-key: apple
          workspaces: |
            core
            server-rs

      # The lib and the generated bindings carry matching API checksums, so the
      # app can only be built from freshly generated ones — see build-bindings.sh.
      #
      # A pull request only runs tests on an arm64 simulator, so it builds that
      # slice and the host one bindgen needs and skips the rest — 29m to 19m.
      # A push to main builds every slice: it is what catches a device or macOS
      # break before a release does, and it leaves a complete cache behind for
      # TestFlight to restore.
      - name: Build Rust core and PatchworkServer xcframework
        run: |
          set -uo pipefail
          # Two independent workspaces writing to separate target dirs and
          # generating different files, so they overlap cleanly. Output goes to
          # a log each rather than interleaving into an unreadable mess.
          ./core/build-bindings.sh > "$RUNNER_TEMP/core.log" 2>&1 &
          core=$!
          ./server-rs/build-xcframework.sh > "$RUNNER_TEMP/server.log" 2>&1 &
          server=$!
          core_rc=0; server_rc=0
          wait $core || core_rc=$?
          wait $server || server_rc=$?
          echo "::group::core/build-bindings.sh (exit $core_rc)"
          cat "$RUNNER_TEMP/core.log"
          echo "::endgroup::"
          echo "::group::server-rs/build-xcframework.sh (exit $server_rc)"
          cat "$RUNNER_TEMP/server.log"
          echo "::endgroup::"
          if [ $core_rc -ne 0 ] || [ $server_rc -ne 0 ]; then exit 1; fi
        env:
          SIMULATOR_ONLY: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && '0' || '1' }}

      - name: Build web bundle
        run: |
          cd web
          npm install -g pnpm
          pnpm install
          pnpm build

      # The runner image's simulator lineup moves with Xcode, so take whichever
      # iPhone the newest installed iOS runtime offers rather than naming one.
      - name: Pick a simulator
        run: |
          UDID=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          for runtime in sorted(devices, reverse=True):
              if "iOS" not in runtime:
                  continue
              for device in devices[runtime]:
                  if device["name"].startswith("iPhone"):
                      print(device["udid"])
                      raise SystemExit
          sys.exit("no iPhone simulator available")
          ')
          echo "SIMULATOR_UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl list devices available | grep -B1 "$UDID" || true

      - name: Build and test
        run: |
          xcodebuild test \
            -project Lush.xcodeproj \
            -scheme Lush \
            -destination "id=$SIMULATOR_UDID" \
            -resultBundlePath "$RUNNER_TEMP/Lush.xcresult" \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcresult
          path: ${{ runner.temp }}/Lush.xcresult
          retention-days: 7

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: rust (${{ matrix.crate }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate: [core, server-rs]
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: ${{ matrix.crate }}

      - name: Test
        working-directory: ${{ matrix.crate }}
        run: cargo test

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm test

      - run: pnpm build

  app:
    name: app (iOS simulator)
    # 6 cores rather than 3. This job is ~70% rustc and scales with them.
    runs-on: macos-26-xlarge
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)/Contents/Developer"

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain stable \
              --target aarch64-apple-ios --target aarch64-apple-ios-sim

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: |
            core
            server-rs

      # The lib and the generated bindings carry matching API checksums, so the
      # app can only be built from freshly generated ones — see build-bindings.sh.
      # This job only ever runs tests on an arm64 simulator, so it builds that
      # slice and the host one bindgen needs, and skips the device and macOS
      # slices it would throw away.
      - name: Build Rust core and bindings
        run: ./core/build-bindings.sh
        env:
          SIMULATOR_ONLY: 1

      - name: Build PatchworkServer xcframework and bindings
        run: ./server-rs/build-xcframework.sh
        env:
          SIMULATOR_ONLY: 1

      - name: Build web bundle
        run: |
          cd web
          npm install -g pnpm
          pnpm install
          pnpm build

      # The runner image's simulator lineup moves with Xcode, so take whichever
      # iPhone the newest installed iOS runtime offers rather than naming one.
      - name: Pick a simulator
        run: |
          UDID=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          for runtime in sorted(devices, reverse=True):
              if "iOS" not in runtime:
                  continue
              for device in devices[runtime]:
                  if device["name"].startswith("iPhone"):
                      print(device["udid"])
                      raise SystemExit
          sys.exit("no iPhone simulator available")
          ')
          echo "SIMULATOR_UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl list devices available | grep -B1 "$UDID" || true

      - name: Build and test
        run: |
          xcodebuild test \
            -project Lush.xcodeproj \
            -scheme Lush \
            -destination "id=$SIMULATOR_UDID" \
            -resultBundlePath "$RUNNER_TEMP/Lush.xcresult" \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcresult
          path: ${{ runner.temp }}/Lush.xcresult
          retention-days: 7

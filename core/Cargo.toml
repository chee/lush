[package]
name = "lush-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "lush_core"
crate-type = ["lib", "staticlib", "cdylib"]

[[bin]]
name = "lush"
path = "src/bin/lush.rs"

[dependencies]
automerge = { git = "https://github.com/automerge/automerge", branch = "main" }
sedimentree_core = { git = "https://github.com/inkandswitch/subduction", rev = "9c0fbfd06bd499d4a8b53548788119d33af0d1ec", features = ["std"] }
sedimentree_fs_storage = { git = "https://github.com/inkandswitch/subduction", rev = "9c0fbfd06bd499d4a8b53548788119d33af0d1ec" }
subduction_core = { git = "https://github.com/inkandswitch/subduction", rev = "9c0fbfd06bd499d4a8b53548788119d33af0d1ec", features = ["system_time"] }
subduction_crypto = { git = "https://github.com/inkandswitch/subduction", rev = "9c0fbfd06bd499d4a8b53548788119d33af0d1ec", features = ["std"] }
subduction_websocket = { git = "https://github.com/inkandswitch/subduction", rev = "9c0fbfd06bd499d4a8b53548788119d33af0d1ec", features = ["tokio_client"] }
future_form = "0.3.0"
# pure-Rust blake3 so its C kernels can't collide with the copy inside
# PatchworkServerFFI when both static libs link into the app
blake3 = { version = "1.8", features = ["pure"] }
tokio = { version = "1.46", features = ["full"] }
tungstenite = "0.27"
async-lock = "3.4"
nonempty = "0.12"
bs58 = { version = "0.5", features = ["check"] }
rand = "0.9"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uniffi = { version = "0.29", features = ["cli"] }
clap = { version = "4.5", features = ["derive"] }
rusqlite = { version = "0.32", features = ["bundled"] }
futures = "0.3"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 2

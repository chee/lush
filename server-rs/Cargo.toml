[package]
name = "patchwork-server"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"

[lib]
name = "patchwork_server"
crate-type = ["staticlib", "cdylib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["cli"]

[dependencies]
swampland = { path = "../../swampland" }
sedimentree_fs_storage = "0.12.2"
iroh = "1"
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread"] }
tracing = "0.1"
uniffi = "0.29"

[features]
default = []
cli = ["uniffi/cli"]

[profile.release]
opt-level = 3
lto = "thin"
panic = "abort"
strip = "debuginfo"

[dev-dependencies]
tempfile = "3"
